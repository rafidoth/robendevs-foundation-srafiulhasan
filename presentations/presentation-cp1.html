<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkpoint 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f4f4f4;--pn:#fff;--fg:#0a0a0a;--mut:#666;--card:rgba(255,255,255,.75);--bd:rgba(0,0,0,.14);--sh:0 12px 30px -12px rgba(0,0,0,.25);--bar:rgba(255,255,255,.88);--hl:rgba(0,0,0,.07);--glow:rgba(0,0,0,.35);--blob:.07;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#050505;--pn:#101010;--fg:#f4f4f4;--mut:#9a9a9a;--card:rgba(255,255,255,.05);--bd:rgba(255,255,255,.14);--sh:0 14px 40px -14px rgba(0,0,0,.8);--bar:rgba(16,16,16,.82);--hl:rgba(255,255,255,.1);--glow:rgba(255,255,255,.22);--blob:.1}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#050505;--pn:#101010;--fg:#f4f4f4;--mut:#9a9a9a;--card:rgba(255,255,255,.05);--bd:rgba(255,255,255,.14);--sh:0 14px 40px -14px rgba(0,0,0,.8);--bar:rgba(16,16,16,.82);--hl:rgba(255,255,255,.1);--glow:rgba(255,255,255,.22);--blob:.1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;transition:background .4s,color .4s}
svg:not(.links){fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;background-image:radial-gradient(circle,var(--bd) 1px,transparent 1.3px);background-size:30px 30px}
.bg i{position:absolute;width:48vmax;height:48vmax;border-radius:50%;filter:blur(100px);opacity:var(--blob);animation:drift 24s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--fg);top:-20vmax;left:-14vmax}
.bg i:nth-child(2){background:var(--fg);bottom:-24vmax;right:-14vmax;animation-delay:-10s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#deck{position:relative;height:100%;z-index:1}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:clamp(16px,4vh,44px) clamp(16px,5vw,72px) 84px;overflow:auto;opacity:0;visibility:hidden;transform:translateX(7%) scale(.985);transition:opacity .18s ease,transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s}
.slide.active{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.slide.before{transform:translateX(-7%) scale(.985)}
.head{text-align:center;margin-bottom:clamp(22px,6vh,60px)}
h1{font-size:clamp(32px,5.4vw,70px);line-height:1.04;letter-spacing:-.035em;font-weight:800;background:linear-gradient(90deg,var(--fg),var(--mut),var(--fg));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 8s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.active .head{animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.95)}}
.wrap{position:relative;max-width:1100px;width:100%;margin:0 auto}
.grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(26px,6vh,46px) clamp(30px,5vw,64px)}
.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.active .links{animation:fade 1s .9s backwards}
@keyframes fade{from{opacity:0}}
.links path{fill:none;stroke:var(--mut);stroke-opacity:.6;stroke-width:1.6;stroke-dasharray:3 7;stroke-linecap:round;animation:flow 1.1s linear infinite}
.links circle{fill:var(--bg);stroke:var(--mut);stroke-width:1.6}
@keyframes flow{to{stroke-dashoffset:-20}}
.card{--c:var(--fg);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;justify-self:center;width:fit-content;max-width:100%;min-height:clamp(70px,11vh,110px);padding:10px 14px;text-align:center;font:inherit;color:var(--fg);cursor:pointer;border:0;background:transparent;transition:transform .38s cubic-bezier(.2,.9,.3,1.35)}
.active .card{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*80ms + 150ms)}
.card::before{display:none}
.card:hover,.card:focus-visible{transform:scale(1.12);z-index:3}
.card:hover::before{opacity:1}
.card:focus-visible{outline:2px solid var(--c);outline-offset:4px}
.num{display:none}

.card h2{position:relative;font-size:clamp(20px,2.4vw,30px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.card h2::after{content:"";display:block;height:2px;margin-top:7px;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.card:hover h2::after,.card:focus-visible h2::after{transform:scaleX(1)}
.foot{position:relative;display:flex;align-items:center;justify-content:center;gap:12px}
.dots{display:flex;gap:5px;opacity:0;transition:opacity .3s}
.card:hover .dots,.card:focus-visible .dots{opacity:1}
.dots i{width:16px;height:4px;border-radius:4px;background:var(--c);opacity:.35;transition:width .35s calc(var(--j)*45ms),opacity .35s calc(var(--j)*45ms)}
.card:hover .dots i{width:24px;opacity:1}
.go{width:20px;height:20px;color:var(--c);opacity:0;transform:translateX(-10px);transition:.35s}
.card:hover .go{opacity:1;transform:none}
.ov{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end;background:rgba(6,8,22,0);visibility:hidden;transition:background .35s,backdrop-filter .35s,visibility 0s .5s}
.ov.open{background:rgba(6,8,22,.4);backdrop-filter:blur(4px);visibility:visible;transition-delay:0s}
.panel{position:relative;width:min(520px,100%);height:100%;overflow:auto;display:flex;flex-direction:column;padding-bottom:76px;border-radius:28px 0 0 28px;background:var(--pn);border:1px solid var(--bd);border-right:0;box-shadow:-30px 0 80px -20px var(--glow);transform:translateX(104%);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.ov.open .panel{transform:none}
.side{flex:none;padding:44px 34px 30px;display:flex;flex-direction:column;justify-content:flex-end;min-height:150px;color:var(--bg);background:var(--fg)}
.side .n{display:none}
.side h3{padding-right:46px;font-size:clamp(26px,3.2vw,36px);line-height:1.08;letter-spacing:-.025em;font-weight:800}
.list{--c:var(--fg);position:relative;flex:1;list-style:none;padding:30px 28px 30px 46px;display:flex;flex-direction:column;justify-content:flex-start;gap:4px}
.list::before{content:"";position:absolute;left:20px;top:46px;bottom:46px;width:2px;background:linear-gradient(var(--c),transparent);transform-origin:top;transform:scaleY(0);transition:transform .35s}
.ov.open .list::before{transform:scaleY(1);transition:transform .7s .15s cubic-bezier(.3,.7,.2,1)}
.kw{opacity:0;transform:translateX(26px);transition:opacity .25s,transform .3s}
.ov.open .kw{opacity:1;transform:none;transition:opacity .4s calc(var(--i)*65ms + 220ms),transform .5s calc(var(--i)*65ms + 220ms) cubic-bezier(.2,.8,.2,1)}
.row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:10px 14px;border:0;border-radius:12px;background:transparent;color:inherit;font:inherit;font-size:clamp(15px,1.6vw,18px);font-weight:500;text-align:left}
.row::before{content:"";position:absolute;left:-31px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--pn);border:2px solid var(--c);transition:background .3s,transform .3s}
button.row{cursor:pointer;transition:background .25s}
button.row:hover{background:var(--hl)}
.has .row::before{background:var(--c)}
.kw.on .row::before,.row:hover::before{transform:scale(1.35)}
.ic{width:16px;height:16px;flex:none;color:var(--c);transition:transform .35s cubic-bezier(.3,1.4,.4,1)}
.kw.on .ic{transform:rotate(135deg)}
.note{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1),opacity .3s}
.note>div{overflow:hidden;min-height:0}
.kw.on .note{grid-template-rows:1fr;opacity:1}
.note p{margin:4px 14px 10px;padding:12px 16px;font-size:14.5px;line-height:1.55;color:var(--mut);border-left:3px solid var(--c);border-radius:0 12px 12px 0;background:var(--hl)}
.x{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--bd);background:var(--bar);color:var(--fg);cursor:pointer;opacity:0;transform:rotate(-90deg) scale(.5);transition:opacity .25s,transform .35s}
.ov.open .x{opacity:1;transform:none;transition-delay:.2s}
.ov.open .x:hover{transform:rotate(90deg)}
.x svg,.bar svg{width:18px;height:18px}
.barwrap{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.bar{pointer-events:auto;display:flex;align-items:center;gap:2px;padding:6px;border-radius:99px;background:var(--bar);border:1px solid var(--bd);backdrop-filter:blur(12px);box-shadow:var(--sh);opacity:.25;transition:opacity .3s,transform .3s}
.bar:hover,.bar:focus-within{opacity:1;transform:translateY(-2px)}
.bar button{width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--fg);cursor:pointer;transition:background .2s,transform .2s}
.bar button:hover:not(:disabled){background:var(--hl);transform:scale(1.14)}
.bar button:disabled{opacity:.3;cursor:default}
.bar button:focus-visible{outline:2px solid var(--fg)}
.cnt{padding:0 8px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.sep{width:1px;height:18px;margin:0 4px;background:var(--bd)}
.grid.g5{grid-template-columns:repeat(6,1fr)}
.grid.g5 .card{grid-column:span 2}
.grid.g5 .card:nth-child(4){grid-column:2/span 2}
.grid.g5 .card:nth-child(5){grid-column:4/span 2}
.grid.g8{grid-template-columns:repeat(6,1fr)}
.grid.g8 .card{grid-column:span 2}
.grid.g8 .card:nth-child(7){grid-column:3/span 2}
.card.nop{cursor:default}
.grid.g8.f8 .card:nth-child(7){grid-column:2/span 2}
.grid.g8.f8 .card:nth-child(8){grid-column:4/span 2}
#s4::before{content:"";position:absolute;top:0;right:0;width:min(60vmax,640px);height:min(60vmax,640px);pointer-events:none;background:radial-gradient(circle at 100% 0%,rgba(255,196,0,.26),rgba(255,196,0,.08) 42%,transparent 70%);opacity:0;transition:opacity .5s}
#s4.active::before{opacity:1;transition-delay:.15s}
.panel.cd{width:min(780px,100%)}
.body{--c:var(--fg);flex:1;padding:30px 28px;display:flex;flex-direction:column;justify-content:flex-start;gap:16px;min-width:0}
.desc{font-size:15px;line-height:1.55;color:var(--mut)}
.code{margin:0;padding:18px 20px;overflow:auto;font:500 13.5px/1.7 ui-monospace,'SF Mono',Menlo,Consolas,monospace;color:var(--fg);background:var(--hl);border-left:3px solid var(--c);border-radius:0 14px 14px 0;white-space:pre;tab-size:2}
.grid.g11{grid-template-columns:repeat(12,1fr);gap:clamp(18px,4vh,32px) clamp(24px,3.4vw,48px)}
.grid.g11 .card{grid-column:span 3}
.grid.g11 .card:nth-child(9){grid-column:3/span 3}
.grid.g11 .card:nth-child(10){grid-column:6/span 3}
.grid.g11 .card:nth-child(11){grid-column:9/span 3}
.grid.g11 .card h2{font-size:clamp(16px,1.8vw,23px)}

.toc{list-style:none;padding:0;width:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:clamp(10px,2.6vh,24px)}
.active .toc li{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*80ms + 150ms)}
.toc button{position:relative;padding:6px 14px;border:0;background:none;color:var(--fg);font:inherit;font-size:clamp(26px,4vw,52px);font-weight:700;letter-spacing:-.025em;line-height:1.15;cursor:pointer;transform-origin:right center;transition:transform .38s cubic-bezier(.2,.9,.3,1.35)}
.toc button::after{content:"";display:block;height:2px;margin-top:6px;background:var(--fg);transform:scaleX(0);transform-origin:right;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.toc button:hover,.toc button:focus-visible{transform:scale(1.12)}
.toc button:hover::after,.toc button:focus-visible::after{transform:scaleX(1)}
.toc button:focus-visible{outline:2px solid var(--fg);outline-offset:4px;border-radius:6px}
#s5 .head{margin-bottom:clamp(14px,3.5vh,34px)}
.desc.big{padding:16px 20px;font-size:clamp(17px,2vw,21px);line-height:1.5;font-weight:500;color:var(--fg);background:var(--hl);border-left:3px solid var(--c);border-radius:0 14px 14px 0}
.code b{font-weight:800}
.code .c{color:var(--mut);font-style:italic}
.code .s{padding:0 3px;border-radius:4px;background:var(--bd)}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}
.grid.g9 .card:nth-child(9){grid-column:1/-1}.grid.g11{grid-template-columns:repeat(2,1fr)}.grid.g11 .card,.grid.g11 .card:nth-child(n){grid-column:auto}.grid.g11 .card:nth-child(11){grid-column:1/-1}.grid.g8{grid-template-columns:repeat(2,1fr)}.grid.g8 .card{grid-column:auto}.grid.g8 .card:nth-child(7){grid-column:1/-1}.grid.g8.f8 .card:nth-child(7){grid-column:auto}.grid.g8.f8 .card:nth-child(8){grid-column:auto}
.grid.g5{grid-template-columns:repeat(2,1fr)}.grid.g5 .card,.grid.g5 .card:nth-child(4){grid-column:auto}.grid.g5 .card:nth-child(5){grid-column:1/-1}.panel,.panel.cd{width:100%;border-radius:0}.side{padding:36px 24px 22px;min-height:120px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i></div>

<main id="deck">
  <section class="slide active" id="s0">
    <header class="head"><h1>Topics</h1></header>
    <ul class="toc" id="toc"></ul>
  </section>
  <section class="slide" id="s1">
    <header class="head"><h1>Networking Fundamentals</h1></header>
    <div class="wrap"><svg id="links" class="links"></svg><div class="grid" id="grid"></div></div>
  </section>
  <section class="slide" id="s2">
    <header class="head"><h1>Miscellaneous</h1></header>
    <div class="wrap"><svg id="links2" class="links"></svg><div class="grid g5" id="grid2"></div></div>
  </section>
  <section class="slide" id="s3">
    <header class="head"><h1>Browser Internals</h1></header>
    <div class="wrap"><svg id="links3" class="links"></svg><div class="grid g8" id="grid3"></div></div>
  </section>
  <section class="slide" id="s4">
    <header class="head"><h1>JavaScript</h1></header>
    <div class="wrap"><svg id="links4" class="links"></svg><div class="grid g8 f8" id="grid4"></div></div>
  </section>
  <section class="slide" id="s5">
    <header class="head"><h1>Frontend &amp; React</h1></header>
    <div class="wrap"><svg id="links5" class="links"></svg><div class="grid g11" id="grid5"></div></div>
  </section>
  <section class="slide" id="s6">
    <header class="head"><h1>Backend</h1></header>
    <div class="wrap"><svg id="links6" class="links"></svg><div class="grid g9" id="grid6"></div></div>
  </section>
</main>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-hidden="true">
  <button class="x" id="x" aria-label="Close" title="Close" data-i="x"></button>
  <div class="panel" id="panel"></div>
</div>

<div class="barwrap"><nav class="bar" aria-label="Slide controls">
  <button id="pv" data-i="l" aria-label="Previous slide" title="Previous slide"></button>
  <span class="cnt" id="cnt">01 / 07</span>
  <button id="nx" data-i="r" aria-label="Next slide" title="Next slide"></button>
  <span class="sep"></span>
  <button id="th" aria-label="Toggle dark or light mode" title="Dark / light"></button>
  <button id="fs" aria-label="Toggle full screen" title="Full screen"></button>
</nav></div>

<script>
// Each keyword is a string, or [keyword, note]. Notes open on click.
const D0=[
 {t:"Networking Fundamentals",to:1},
 {t:"Browser Internals",to:3},
 {t:"JavaScript",to:4},
 {t:"Frontend & React",to:5},
 {t:"Backend",to:6}
];
const D=[
 {t:"Browser Initiation",k:["URL / Search Term","URL Parsing",["HSTS","Preloaded list forces HTTPS and blocks downgrade attacks."],"Punycode (IDN)","Browser Policies / Extensions"]},
 {t:"DNS Resolution",k:["Browser Cache","OS Cache","Router / ISP Cache","Recursive Resolver","Root → TLD → Authoritative NS","DNS Records (A / AAAA / CNAME)",["TTL","How long a resolver may cache an answer. Inspect it with dig."]]},
 {t:"Connection Establishment",k:["Socket Creation",["TCP 3-Way Handshake (SYN → SYN-ACK → ACK)","Both sides agree on initial sequence numbers before data flows."],"TLS Handshake","Certificate Verification","Key Exchange"]},
 {t:"Request Transmission",k:["HTTP Request","Request Line","Headers","Body","TCP / IP / Ethernet Encapsulation"]},
 {t:"Server Processing",k:["Request Parsing","Application Logic","Business Logic","Response Generation"]},
 {t:"Response Delivery",k:["HTTP Status Code","Response Headers","Response Body (JSON / HTML)","Client-Side Rendering (CSR)","Browser Rendering"]}
];
const D2=[
 {t:"CORS",k:["Same-Origin Policy",["Preflight (OPTIONS)","For requests that can change data, the browser asks the server first."],"Access-Control-Allow-Origin","Allowed Methods / Headers",["Credentials","Wildcard origin does not work with credentials. Name the origin."]]},
 {t:"HttpOnly Cookie",k:["Set-Cookie",["HttpOnly","JavaScript cannot read the cookie. XSS cannot steal it."],"Secure",["SameSite","Controls cross-site sending. Helps against CSRF."],"Sent Automatically by the Browser"]},
 {t:"localStorage",k:["Key-Value Store","Stays After Browser Close","About 5 MB per Origin",["Readable by JavaScript","Any XSS can read it. Avoid storing auth tokens here."],"Synchronous API"]},
 {t:"sessionStorage",k:["Key-Value Store","Per Tab","Cleared When Tab Closes","Not Sent to Server",["Same Origin Only","A new tab on the same site gets its own copy."]]},
 {t:"TCP/IP",k:["Application → Transport → Internet → Link",["TCP","Reliable, ordered delivery. Uses retransmission and flow control."],["IP","Addressing and routing of packets."],"Ports","Congestion Control"]}
];
const D3=[
 {t:"Critical Rendering Path",k:["Constructing the Document Object Model (DOM) from the HTML","Constructing the CSS Object Model (CSSOM) from the CSS","Applying any JavaScript that alters the DOM or CSSOM","Constructing the render tree from the DOM and CSSOM","Perform style and layout operations on the page to see what elements fit where","Paint the pixels of the elements in memory","Composite the pixels if any of them overlap","Physically draw all the resulting pixels to screen"]},
 {t:"Building the DOM Tree",k:["HTML Parsing & Forgiving Nature of HTML Parsing","Parsing Algorithm: Tokenization & Tree Construction","What Doesn't Block the Parser","Preload Scanner"]},
 {t:"Building the CSSOM Tree",k:[]},
 {t:"Render Tree",k:[]},
 {t:"Layout",k:[]},
 {t:"Paint",k:[]},
 {t:"Composite",k:[]}
];
const D4=[
 {t:"Closures",desc:"A function remembers variables from its outer scope, even after the outer function finishes.",code:`const counter = () => {
  let count = 0;

  return () => {
    count++;
    console.log(count);
  };
};

const increment = counter();

increment(); // 1
increment(); // 2
increment(); // 3`},
 {t:"Promises",desc:"A Promise represents the eventual success or failure of an asynchronous operation.",code:`const fetchData = new Promise((resolve, reject) => {
  setTimeout(() => {
    resolve("Data received!");
  }, 1000);
});

fetchData
  .then(data => console.log(data))
  .catch(error => console.log(error));`},
 {t:"Async / Await",desc:"async/await is a cleaner way to write asynchronous code with Promises.",code:`const fetchData = () => {
  return new Promise(resolve => {
    setTimeout(() => resolve("Data received!"), 1000);
  });
};

const getData = async () => {
  const data = await fetchData();
  console.log(data);
};

getData();`},
 {t:"Hoisting",desc:"JavaScript processes declarations before it runs the code. This is called hoisting.",code:`console.log(name); // undefined

var name = "Rafiul";

// Equivalent behavior:
// var name;
// console.log(name);
// name = "Rafiul";`},
 {t:"Temporal Dead Zone (TDZ)",desc:"The TDZ is the period between entering a scope and initializing a let or const variable.",code:`{
  // TDZ starts
  console.log(name); // ReferenceError

  let name = "Rafiul";
  // TDZ ends

  console.log(name); // Rafiul
}`},
 {t:"Scopes",desc:"Scope decides where a variable can be accessed.",code:`const global = "Global";

const example = () => {
  const functionScope = "Function";

  if (true) {
    let blockScope = "Block";

    console.log(global);
    console.log(functionScope);
    console.log(blockScope);
  }

  // console.log(blockScope); // ReferenceError
};

example();`},
 {t:"Execution Context",k:["Global Execution Context & Functional Execution Context","Creation Phase & Execution Phase","Lexical Environment & Variable Environment","Environment Record & Outer Environment Record (Scope Chain)"]},
 {t:"Event Loop",k:["Microtask Queue","Macrotask Queue","Execution Priorities","process.nextTick()"]}
];
const D5=[
 {t:"Component Architecture",k:["Components","Props","State","Composition","One-Way Data Flow"]},
 {t:"State Management",k:["Built-in Hooks","Context API","Redux Toolkit","RTK Query"]},
 {t:"React",k:[]},
 {t:"CSR (Client-Side Rendering)",desc:"The browser builds the page using JavaScript."},
 {t:"SSR (Server-Side Rendering)",desc:"The server builds HTML for each request."},
 {t:"SSG (Static Site Generation)",desc:"The server builds HTML at deployment time."},
 {t:"ISR (Incremental Static Regeneration)",desc:"Static HTML is refreshed after a configured period."},
 {t:"Hydration",desc:"JavaScript makes server-rendered HTML interactive."}
];
const D6=[
 {t:"Backend Architecture",k:["Backend Architecture & Request Flow","App Servers, Databases, Cache, Queues & Workers","Application Layers: Route, Middleware, Controller, Service, Model / Repository","Monolith vs Microservices vs Serverless"]},
 {t:"REST API",k:["REST Architecture & Resources","HTTP Methods: GET, POST, PUT, PATCH, DELETE","CRUD Operations","Stateless Communication","JSON Representation","Safe vs Idempotent Methods","HTTP Status Codes (2xx, 4xx, 5xx)","REST Endpoint Naming Conventions","Query Parameters & Filtering"]},
 {t:"gRPC",k:["RPC & gRPC Fundamentals","HTTP/2 & Protocol Buffers",".proto Files & Code Generation","Client & Server Stubs",["Four Communication Types","Unary, Server streaming, Client streaming, Bidirectional streaming."],"gRPC Use Cases","Deadlines & Service-to-Service Communication"]},
 {t:"Middleware",k:["Middleware Fundamentals","Request Processing Pipeline","Authentication & Logging","Request IDs & CORS","Rate Limiting & Error Handling","Middleware Execution Order"]},
 {t:"Authentication vs Authorization",k:["Authentication: Who Are You?","Authorization: What Can You Do?","401 vs 403 Status Codes","Session-Based Authentication","Bearer Token Authentication","RBAC (Role-Based Access Control)","ABAC (Attribute-Based Access Control)","Resource Ownership & Policies","JWT"]},
 {t:"OAuth 2.0",k:["OAuth 2.0 Fundamentals","Resource Owner, Client, Authorization Server, Resource Server","Access Tokens & Refresh Tokens","Scopes & Redirect URI","Authorization Code + PKCE Flow","Implicit & Password Grant (Avoid)"]},
 {t:"Rate Limiting",k:["Why Rate Limiting Is Needed","Rate Limiting by User, API Key & IP","Redis-Based Counters","HTTP 429 Response","Retry-After & Rate-Limit Headers"]},
 {t:"API Versioning",k:["Why API Versioning Is Needed","URL-Based Versioning","Header-Based Versioning","Query Parameter Versioning","Date-Based Versioning","Breaking vs Non-Breaking Changes","API Deprecation Lifecycle"]},
 {t:"Idempotency Keys",k:["Idempotency Key Fundamentals","Safe Retries for POST Requests","Unique Keys per Action","Store Keys & Previous Results","Prevent Duplicate Payments & Orders","Handle Reused Keys with Different Request Bodies"]}
];
const H=[255,200,155,45,330,15,100,300,60,180,240];
const P={l:'<path d="m15 18-6-6 6-6"/>',r:'<path d="m9 18 6-6-6-6"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',plus:'<path d="M12 5v14M5 12h14"/>',go:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
 max:'<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>',
 min:'<path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/>'};
const svg=(p,c='')=>`<svg class="${c}" viewBox="0 0 24 24">${p}</svg>`;
const $=s=>document.querySelector(s),grid=$('#grid'),ov=$('#ov'),pn=$('#panel');
document.querySelectorAll('[data-i]').forEach(b=>b.innerHTML=svg(P[b.dataset.i]));

/* Cards + connecting nodes, one set per slide */
$('#toc').innerHTML=D0.map((d,i)=>`<li style="--i:${i}"><button data-to="${d.to}">${d.t}</button></li>`).join('');
$('#toc').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.to)};
const DECK=[{draw(){}},{d:D,g:$('#grid'),l:$('#links')},{d:D2,g:$('#grid2'),l:$('#links2')},{d:D3,g:$('#grid3'),l:$('#links3')},{d:D4,g:$('#grid4'),l:$('#links4')},{d:D5,g:$('#grid5'),l:$('#links5')},{d:D6,g:$('#grid6'),l:$('#links6')}];
DECK.forEach(sl=>{
 if(!sl.d)return;
 sl.d.forEach((d,i)=>{
  const b=document.createElement('button');
  const one=!!(d.code||d.desc||d.to!=null),has=one||d.k.length>0,nd=one?1:d.k.length;
  b.className='card'+(has?'':' nop');b.style.cssText=`--h:${H[i]};--i:${i}`;
  b.innerHTML=`<h2>${d.t}</h2><span class="foot"><span class="dots">${Array.from({length:nd},(_,j)=>`<i style="--j:${j}"></i>`).join('')}</span>${has?svg(P.go,'go'):''}</span>`;
  if(has)b.onclick=()=>d.to!=null?go(d.to):openP(d,i,b);
  b.onpointermove=e=>{const r=b.getBoundingClientRect();b.style.setProperty('--mx',e.clientX-r.left+'px');b.style.setProperty('--my',e.clientY-r.top+'px')};
  sl.g.append(b);
 });
 sl.draw=()=>{
  const cs=[...sl.g.children],R=e=>({l:e.offsetLeft,t:e.offsetTop,r:e.offsetLeft+e.offsetWidth,b:e.offsetTop+e.offsetHeight});
  let h='';
  for(let i=0;i<cs.length-1;i++){
   const a=R(cs[i]),b=R(cs[i+1]);let x1,y1,x2,y2,d;
   if(Math.abs(a.t-b.t)<8){x1=a.r;y1=(a.t+a.b)/2;x2=b.l;y2=(b.t+b.b)/2;d=`M${x1} ${y1}H${x2}`}
   else{x1=(a.l+a.r)/2;y1=a.b;x2=(b.l+b.r)/2;y2=b.t;const m=(y1+y2)/2;d=`M${x1} ${y1}C${x1} ${m} ${x2} ${m} ${x2} ${y2}`}
   h+=`<path d="${d}"/><circle cx="${x1}" cy="${y1}" r="4"/><circle cx="${x2}" cy="${y2}" r="4"/>`;
  }
  sl.l.innerHTML=h;
 };
 new ResizeObserver(sl.draw).observe(sl.g);
});
document.fonts&&document.fonts.ready.then(()=>DECK.forEach(sl=>sl.draw()));

/* Keyword panel: opens from the clicked card, notes expand on click */
const hl=c=>c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/(\/\/.*)|("(?:[^"\\]|\\.)*")|\b(const|let|var|return|async|await|new|if|true)\b/g,(m,a,b,k)=>a?`<i class="c">${m}</i>`:b?`<i class="s">${m}</i>`:`<b>${m}</b>`);
function openP(d,i,el){
 pn.style.setProperty('--h',H[i]);pn.classList.toggle('cd',!!d.code);
 const side=`<div class="side"><h3>${d.t}</h3></div>`;
 if(d.code)pn.innerHTML=side+`<div class="body"><p class="desc kw" style="--i:0">${d.desc}</p><pre class="code kw" style="--i:1">${hl(d.code)}</pre></div>`;
 else if(d.desc)pn.innerHTML=side+`<div class="body"><p class="desc big kw" style="--i:0">${d.desc}</p></div>`;
 else pn.innerHTML=side+`<ul class="list">${d.k.map((k,j)=>{
  const [t,n]=[].concat(k);
  return `<li class="kw${n?' has':''}" style="--i:${j}">`+(n?`<button class="row"><span>${t}</span>${svg(P.plus,'ic')}</button><div class="note"><div><p>${n}</p></div></div>`:`<div class="row"><span>${t}</span></div>`)+`</li>`;
 }).join('')}</ul>`;
 pn.querySelectorAll('button.row').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('on'));
 ov.classList.add('open');ov.setAttribute('aria-hidden','false');
}
function closeP(){ov.classList.remove('open');ov.setAttribute('aria-hidden','true')}
ov.onclick=e=>{if(e.target===ov)closeP()};
$('#x').onclick=closeP;

/* Slide engine */
const S=[...document.querySelectorAll('.slide')];let n=0;
function go(i){
 if(i<0||i>=S.length||i===n)return;
 closeP();n=i;
 S.forEach((s,k)=>{s.classList.toggle('active',k===n);s.classList.toggle('before',k<n)});
 ui();requestAnimationFrame(()=>DECK[n].draw());
}
function ui(){
 $('#cnt').textContent=`${String(n+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}`;
 $('#pv').disabled=n===0;$('#nx').disabled=n===S.length-1;
}
$('#pv').onclick=()=>go(n-1);$('#nx').onclick=()=>go(n+1);

/* Theme + full screen */
const dk=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches};
const themeIcon=()=>$('#th').innerHTML=svg(dk()?P.sun:P.moon);
$('#th').onclick=()=>{document.documentElement.dataset.theme=dk()?'light':'dark';themeIcon()};
const fsIcon=()=>$('#fs').innerHTML=svg(document.fullscreenElement?P.min:P.max);
$('#fs').onclick=()=>{try{(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{})}catch(e){}};
document.addEventListener('fullscreenchange',fsIcon);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',themeIcon);

document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeP();
 else if(e.key==='ArrowRight'||e.key==='PageDown')go(n+1);
 else if(e.key==='ArrowLeft'||e.key==='PageUp')go(n-1);
 else if(e.key==='f'||e.key==='F')$('#fs').click();
});
themeIcon();fsIcon();ui();
</script>
</body>
</html>
